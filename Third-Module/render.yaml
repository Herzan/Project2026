# Render Blueprint: one web service that serves both the API and the React app.
# MongoDB is hosted on MongoDB Atlas (Render does not offer MongoDB).
services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # Render will ask you to paste your Atlas connection string
      - key: JWT_SECRET
        generateValue: true    # Render creates a random secret for you
      - key: SEED_DEMO_DATA
        value: "true"          # creates admin / admin123 etc. on an empty database
